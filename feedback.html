<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback — Atithi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-slate-50 min-h-screen flex flex-col font-sans text-slate-800">
    <div
      id="navbar"
      class="sticky top-0 z-50 bg-white border-b border-slate-200"
    ></div>

    <main class="flex-1 py-16 px-4">
      <div class="max-w-xl mx-auto">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-10">
          <div class="text-center mb-10">
            <h1
              class="text-2xl font-serif font-bold text-slate-900"
              id="form-title"
            >
              Your Feedback
            </h1>
            <p class="text-slate-500 text-sm mt-2" id="form-desc">
              We value your opinion.
            </p>
          </div>

          <div
            id="msg-box"
            class="hidden text-sm px-4 py-3 rounded-md mb-6"
          ></div>

          <div id="feedback-form" class="space-y-6">
            <div>
              <label
                class="block text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-2"
                >Rate Us</label
              >
              <div class="flex gap-4" id="rating-stars">
                <button
                  onclick="setRating(1)"
                  class="text-2xl hover:scale-125 transition opacity-30"
                  id="star-1"
                >
                  ⭐
                </button>
                <button
                  onclick="setRating(2)"
                  class="text-2xl hover:scale-125 transition opacity-30"
                  id="star-2"
                >
                  ⭐
                </button>
                <button
                  onclick="setRating(3)"
                  class="text-2xl hover:scale-125 transition opacity-30"
                  id="star-3"
                >
                  ⭐
                </button>
                <button
                  onclick="setRating(4)"
                  class="text-2xl hover:scale-125 transition opacity-30"
                  id="star-4"
                >
                  ⭐
                </button>
                <button
                  onclick="setRating(5)"
                  class="text-2xl hover:scale-125 transition opacity-30"
                  id="star-5"
                >
                  ⭐
                </button>
              </div>
            </div>
            <div>
              <label
                class="block text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-2"
                >Comments</label
              >
              <textarea
                id="comments"
                rows="4"
                class="w-full bg-slate-50 border border-slate-200 rounded-md px-4 py-3 focus:outline-none focus:border-amber-600 transition"
              ></textarea>
            </div>
            <div class="flex gap-3">
              <button
                onclick="submitFeedback()"
                id="submit-btn"
                class="flex-1 bg-slate-900 hover:bg-amber-600 text-white font-bold text-[11px] uppercase tracking-[0.2em] py-4 rounded-md transition"
              >
                Submit
              </button>
              <button
                onclick="openDeleteModal()"
                id="delete-btn"
                class="hidden px-6 bg-red-50 text-red-600 border border-red-200 font-bold text-[11px] uppercase rounded-md hover:bg-red-100 transition"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <div
      id="delete-modal"
      class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-gray-900 bg-opacity-50 px-4"
    >
      <div
        class="bg-white p-8 rounded-sm shadow-xl max-w-sm w-full text-center"
      >
        <h3 class="text-lg font-bold text-gray-900 mb-2">Delete Feedback</h3>
        <p class="text-sm text-gray-500 mb-6">
          Are you sure you want to delete your feedback? This action cannot be
          undone.
        </p>
        <div class="flex gap-4">
          <button
            onclick="closeDeleteModal()"
            class="flex-1 border border-gray-200 py-2 text-xs uppercase font-bold text-gray-600 hover:bg-gray-100"
          >
            Cancel
          </button>
          <button
            onclick="executeDelete()"
            class="flex-1 bg-red-600 text-white py-2 text-xs uppercase font-bold hover:bg-red-700"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script src="js/feedback.js"></script>
    <script src="js/include.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
