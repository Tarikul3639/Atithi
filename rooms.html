<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rooms — Atithi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

  <!-- NAVBAR -->
  <nav class="bg-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-bold text-amber-600">অতিথি <span class="text-gray-500 text-sm font-normal">| Atithi</span></a>
      <div class="flex gap-6 items-center text-sm font-medium">
        <a href="rooms.html" class="text-amber-600 font-semibold">Rooms</a>
        <a href="login.html" class="hover:text-amber-600 transition">Login</a>
        <a href="register.html" class="bg-amber-600 text-white px-4 py-2 rounded hover:bg-amber-700 transition">Register</a>
      </div>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <section class="bg-gray-800 text-white py-14 text-center">
    <h1 class="text-4xl font-bold mb-2">Our Rooms</h1>
    <p class="text-gray-400 text-sm">Choose your perfect stay from our premium collection</p>
  </section>

  <!-- FILTER BAR -->
  <div class="bg-white border-b shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap gap-3 items-center">
      <span class="text-sm text-gray-500 font-medium">Filter by:</span>
      <button onclick="filterRooms(event,'all')" class="filter-btn active-filter px-4 py-1.5 rounded-full text-sm border border-amber-600 text-amber-600 hover:bg-amber-600 hover:text-white transition">All</button>
      <button onclick="filterRooms(event,'single')" class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition">Single</button>
      <button onclick="filterRooms(event,'double')" class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition">Double</button>
      <button onclick="filterRooms(event,'suite')" class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition">Suite</button>
      <button onclick="filterRooms(event,'deluxe')" class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition">Deluxe</button>
    </div>
  </div>

  <!-- ROOMS GRID -->
  <main class="flex-1 max-w-7xl mx-auto px-6 py-12 w-full">
    <div id="rooms-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>

    <div id="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div class="bg-white rounded-xl shadow-sm overflow-hidden animate-pulse">
        <div class="h-52 bg-gray-200"></div>
        <div class="p-5 space-y-3">
          <div class="h-4 bg-gray-200 rounded w-3/4"></div>
          <div class="h-3 bg-gray-200 rounded w-full"></div>
          <div class="h-3 bg-gray-200 rounded w-2/3"></div>
          <div class="h-8 bg-gray-200 rounded w-1/3 mt-4"></div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm overflow-hidden animate-pulse">
        <div class="h-52 bg-gray-200"></div>
        <div class="p-5 space-y-3">
          <div class="h-4 bg-gray-200 rounded w-3/4"></div>
          <div class="h-3 bg-gray-200 rounded w-full"></div>
          <div class="h-3 bg-gray-200 rounded w-2/3"></div>
          <div class="h-8 bg-gray-200 rounded w-1/3 mt-4"></div>
        </div>
      </div>
      <div class="bg-white rounded-xl shadow-sm overflow-hidden animate-pulse">
        <div class="h-52 bg-gray-200"></div>
        <div class="p-5 space-y-3">
          <div class="h-4 bg-gray-200 rounded w-3/4"></div>
          <div class="h-3 bg-gray-200 rounded w-full"></div>
          <div class="h-3 bg-gray-200 rounded w-2/3"></div>
          <div class="h-8 bg-gray-200 rounded w-1/3 mt-4"></div>
        </div>
      </div>
    </div>

    <div id="no-rooms" class="hidden text-center text-gray-400 py-20 text-lg">No rooms found.</div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-800 text-gray-400 text-center py-6 text-sm">
    <p>© 2025 Atithi Hotel. All rights reserved.</p>
  </footer>

  <script>
    let allRooms = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadRooms();
    });

    async function loadRooms() {
      const loading = document.getElementById("loading");
      const container = document.getElementById("rooms-container");
      const noRooms = document.getElementById("no-rooms");

      if (!loading || !container || !noRooms) {
        console.error("Required elements not found in rooms.html");
        return;
      }

      loading.classList.remove("hidden");
      noRooms.classList.add("hidden");

      try {
        if (typeof axios === "undefined") {
          throw new Error("Axios is not loaded");
        }

        const res = await axios.get("api/rooms/get_rooms.php", {
          headers: {
            "Content-Type": "application/json"
          }
        });

        if (res.data && res.data.success && Array.isArray(res.data.rooms)) {
          allRooms = res.data.rooms;
          renderRooms(allRooms);
        } else {
          allRooms = [];
          container.innerHTML = "";
          noRooms.textContent = "No rooms found.";
          noRooms.classList.remove("hidden");
        }
      } catch (err) {
        console.error("Load rooms error:", err);

        container.innerHTML = "";
        noRooms.textContent = "Failed to load rooms. Please try again later.";
        noRooms.classList.remove("hidden");
      } finally {
        loading.classList.add("hidden");
      }
    }

    function renderRooms(rooms) {
      const container = document.getElementById("rooms-container");
      const noRooms = document.getElementById("no-rooms");

      if (!container || !noRooms) return;

      if (!rooms || rooms.length === 0) {
        container.innerHTML = "";
        noRooms.textContent = "No rooms found.";
        noRooms.classList.remove("hidden");
        return;
      }

      noRooms.classList.add("hidden");

      container.innerHTML = rooms.map(room => `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition group">
          <div class="relative overflow-hidden h-52">
            <img
              src="${room.image || 'assets/images/rooms/default.jpg'}"
              alt="${room.name || 'Room'}"
              class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
              onerror="this.src='assets/images/rooms/default.jpg'"
            />
            <span class="absolute top-3 left-3 bg-amber-600 text-white text-xs px-3 py-1 rounded-full capitalize">
              ${room.type || 'room'}
            </span>
            ${
              (room.status || 'available') === 'available'
                ? `<span class="absolute top-3 right-3 bg-green-600 text-white text-xs px-3 py-1 rounded-full">Available</span>`
                : `<span class="absolute top-3 right-3 bg-red-600 text-white text-xs px-3 py-1 rounded-full">Booked</span>`
            }
          </div>

          <div class="p-5">
            <h3 class="text-lg font-semibold text-gray-800 mb-1">${room.name || 'Untitled Room'}</h3>
            <p class="text-gray-500 text-sm mb-3">
              ${room.description || 'No description available.'}
            </p>

            <div class="flex items-center gap-4 text-sm text-gray-500 mb-4">
              <span>👤 ${room.capacity || 1} Guest${Number(room.capacity) > 1 ? 's' : ''}</span>
              <span>🛏 ${room.type || 'room'}</span>
            </div>

            <div class="flex items-center justify-between">
              <div>
                <span class="text-2xl font-bold text-amber-600">
                  ৳${Number(room.price || 0).toLocaleString()}
                </span>
                <span class="text-gray-400 text-xs">/night</span>
              </div>

              ${
                (room.status || 'available') === 'available'
                  ? `<a href="booking.html?room_id=${room.id}" class="bg-amber-600 hover:bg-amber-700 text-white text-sm px-4 py-2 rounded-lg transition">Book Now</a>`
                  : `<button disabled class="bg-gray-400 cursor-not-allowed text-white text-sm px-4 py-2 rounded-lg">Booked</button>`
              }
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterRooms(event, type) {
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.classList.remove("bg-amber-600", "text-white", "border-amber-600");
        btn.classList.add("border-gray-300", "text-gray-600");
      });

      event.target.classList.add("bg-amber-600", "text-white", "border-amber-600");
      event.target.classList.remove("border-gray-300", "text-gray-600");

      if (type === "all") {
        renderRooms(allRooms);
        return;
      }

      renderRooms(allRooms.filter(room => room.type === type));
    }
  </script>

</body>
</html>
