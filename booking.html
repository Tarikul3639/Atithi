<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Room — Atithi</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col">
    <div id="navbar" class="min-h-[73px]"></div>

    <section class="bg-white py-16 border-b border-gray-100">
      <div class="max-w-7xl mx-auto px-6 text-center">
        <h1 class="text-3xl font-serif font-bold text-gray-900 mb-2">Complete Reservation</h1>
        <p class="text-gray-400 text-[11px] uppercase tracking-widest">Ensure your details to finalize your stay</p>
      </div>
    </section>

    <main class="flex-1 max-w-5xl mx-auto px-6 py-12 w-full">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        
        <div class="lg:col-span-2 space-y-8">
          <div class="bg-white p-8 border border-gray-100 shadow-sm">
            <h2 class="text-lg font-serif font-bold text-gray-900 mb-8">Guest Information</h2>
            
            <div id="error-msg" class="hidden bg-red-50 text-red-600 text-xs px-4 py-3 mb-6 border-l-4 border-red-600"></div>
            <div id="success-msg" class="hidden bg-green-50 text-green-600 text-xs px-4 py-3 mb-6 border-l-4 border-green-600"></div>

            <div class="space-y-6">
              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Guest Name</label>
                  <input type="text" id="guest-name" placeholder="Enter your name" class="w-full border-b border-l pl-2 border-gray-200 py-2 text-sm focus:border-amber-600 focus:outline-none transition-colors" />
                </div>
                <div>
                  <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Phone</label>
                  <input type="tel" id="guest-phone" placeholder="Enter your phone number" class="w-full border-b border-l pl-2 border-gray-200 py-2 text-sm focus:border-amber-600 focus:outline-none transition-colors" />
                </div>
              </div>

              <div>
                <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Email Address</label>
                <input type="email" id="guest-email" placeholder="Enter your email address" class="w-full border-b border-l pl-2 border-gray-200 py-2 text-sm focus:border-amber-600 focus:outline-none transition-colors" />
              </div>

              <div class="grid grid-cols-2 gap-6">
                <div>
                  <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Check-in</label>
                  <input type="date" id="check-in" class="w-full border-b border-l pl-2 border-gray-200 py-2 text-sm focus:border-amber-600 focus:outline-none transition-colors" />
                </div>
                <div>
                  <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-2">Check-out</label>
                  <input type="date" id="check-out" class="w-full border-b border-l pl-2 border-gray-200 py-2 text-sm focus:border-amber-600 focus:outline-none transition-colors" />
                </div>
              </div>

              <button onclick="handleBooking()" id="book-btn" class="w-full bg-gray-900 hover:bg-amber-600 text-white py-4 text-[11px] font-bold uppercase tracking-[0.2em] transition-all">
                Confirm Reservation
              </button>
            </div>
          </div>
        </div>

        <div class="lg:col-span-1">
          <div class="bg-white border border-gray-100 shadow-sm sticky top-24">
            <img id="room-image" src="" alt="Room" class="w-full h-48 object-cover bg-gray-100" />
            <div class="p-6">
              <h3 id="room-name" class="font-bold text-gray-900 mb-1">...</h3>
              <p class="text-[11px] uppercase text-gray-400 tracking-widest mb-6" id="room-type">...</p>
              
              <div class="flex gap-4 mb-4">
                <span id="room-status" class="text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded">...</span>
                <span id="room-capacity" class="text-[9px] font-bold uppercase tracking-widest px-2 py-1 bg-gray-100 text-gray-600 rounded">...</span>
              </div>
              
              <div class="space-y-3 text-[12px] text-gray-600 border-t border-gray-100 pt-4">
                <div class="flex justify-between"><span>Nightly Rate</span> <span id="price-per-night">৳0</span></div>
                <div class="flex justify-between"><span>Total Nights</span> <span id="total-nights">-</span></div>
                <div class="flex justify-between font-bold text-gray-900 pt-2 border-t border-gray-100">
                  <span>Grand Total</span> <span id="total-amount" class="text-amber-600">৳0</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script src="js/include.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/booking.js"></script>
  </body>
</html>
