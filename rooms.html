<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rooms — Atithi</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="bg-gray-50 min-h-screen flex flex-col">
    <!-- NAVBAR -->
    <div id="navbar" class="sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center animate-pulse"
      >
        <!-- Logo Placeholder -->
        <div class="h-8 w-40 bg-gray-200 rounded"></div>
        <!-- Links Placeholder -->
        <div class="flex gap-8">
          <div class="h-4 w-16 bg-gray-200 rounded"></div>
          <div class="h-4 w-16 bg-gray-200 rounded"></div>
          <div class="h-8 w-24 bg-gray-200 rounded"></div>
        </div>
      </div>
    </div>

    <!-- PAGE HEADER -->
    <section class="bg-gray-800 text-white py-14 text-center">
      <h1 class="text-4xl font-bold mb-2">Our Rooms</h1>
      <p class="text-gray-400 text-sm">
        Choose your perfect stay from our premium collection
      </p>
    </section>

    <!-- FILTER BAR -->
    <div class="bg-white border-b shadow-sm">
      <div
        class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap gap-3 items-center"
      >
        <span class="text-sm text-gray-500 font-medium">Filter by:</span>

        <button
          onclick="filterRooms(event, 'all')"
          class="filter-btn active-filter px-4 py-1.5 rounded-full text-sm border border-amber-600 text-amber-600 hover:bg-amber-600 hover:text-white transition"
        >
          All
        </button>

        <button
          onclick="filterRooms(event, 'single')"
          class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition"
        >
          Single
        </button>

        <button
          onclick="filterRooms(event, 'double')"
          class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition"
        >
          Double
        </button>

        <button
          onclick="filterRooms(event, 'suite')"
          class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition"
        >
          Suite
        </button>

        <button
          onclick="filterRooms(event, 'deluxe')"
          class="filter-btn px-4 py-1.5 rounded-full text-sm border border-gray-300 text-gray-600 hover:border-amber-600 hover:text-amber-600 transition"
        >
          Deluxe
        </button>
      </div>
    </div>

    <!-- ROOMS GRID -->
    <main class="flex-1 max-w-7xl mx-auto px-6 py-12 w-full">
      <div
        id="rooms-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      ></div>

      <!-- LOADING -->
      <div
        id="loading"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      >
        <div
          class="bg-white rounded-xl shadow-sm overflow-hidden animate-pulse"
        >
          <div class="h-52 bg-gray-200"></div>
          <div class="p-5 space-y-3">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-3 bg-gray-200 rounded w-full"></div>
            <div class="h-3 bg-gray-200 rounded w-2/3"></div>
            <div class="h-8 bg-gray-200 rounded w-1/3 mt-4"></div>
          </div>
        </div>

        <div
          class="bg-white rounded-xl shadow-sm overflow-hidden animate-pulse"
        >
          <div class="h-52 bg-gray-200"></div>
          <div class="p-5 space-y-3">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-3 bg-gray-200 rounded w-full"></div>
            <div class="h-3 bg-gray-200 rounded w-2/3"></div>
            <div class="h-8 bg-gray-200 rounded w-1/3 mt-4"></div>
          </div>
        </div>

        <div
          class="bg-white rounded-xl shadow-sm overflow-hidden animate-pulse"
        >
          <div class="h-52 bg-gray-200"></div>
          <div class="p-5 space-y-3">
            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            <div class="h-3 bg-gray-200 rounded w-full"></div>
            <div class="h-3 bg-gray-200 rounded w-2/3"></div>
            <div class="h-8 bg-gray-200 rounded w-1/3 mt-4"></div>
          </div>
        </div>
      </div>

      <!-- NO ROOMS -->
      <div id="no-rooms" class="hidden text-center text-gray-400 py-20 text-lg">
        No rooms found.
      </div>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <!-- Include system (navbar/footer loader) -->
    <script src="js/include.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/rooms.js"></script>
  </body>
</html>
