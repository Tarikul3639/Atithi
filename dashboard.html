<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Atithi</title>
    <link rel="icon" href="assets/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/logo.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .tab-btn { transition: all 0.3s ease; }
      .active-tab { background-color: #d97706; color: white; border-color: #d97706; }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen flex flex-col font-sans">
    
    <div id="navbar" class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100"></div>

    <section class="bg-gradient-to-r from-gray-900 to-gray-800 text-white py-16 px-6">
      <div class="max-w-7xl mx-auto">
        <p class="text-amber-400 text-xs font-semibold uppercase tracking-widest mb-2">Welcome back</p>
        <h1 class="text-4xl font-serif font-bold" id="user-name">Guest</h1>
        <p class="text-gray-400 text-sm mt-2" id="user-email">guest@email.com</p>
      </div>
    </section>

    <div class="bg-white border-b border-gray-100">
      <div class="max-w-7xl mx-auto px-6 py-8 grid grid-cols-2 md:grid-cols-4 gap-8">
        <div class="text-center group"><p class="text-4xl font-bold text-amber-600 group-hover:scale-110 transition-transform" id="stat-total">0</p><p class="text-gray-400 text-[10px] uppercase tracking-widest mt-2">Total Bookings</p></div>
        <div class="text-center group"><p class="text-4xl font-bold text-green-600 group-hover:scale-110 transition-transform" id="stat-confirmed">0</p><p class="text-gray-400 text-[10px] uppercase tracking-widest mt-2">Confirmed</p></div>
        <div class="text-center group"><p class="text-4xl font-bold text-blue-600 group-hover:scale-110 transition-transform" id="stat-upcoming">0</p><p class="text-gray-400 text-[10px] uppercase tracking-widest mt-2">Upcoming</p></div>
        <div class="text-center group"><p class="text-4xl font-bold text-gray-800 group-hover:scale-110 transition-transform" id="stat-completed">0</p><p class="text-gray-400 text-[10px] uppercase tracking-widest mt-2">Completed</p></div>
      </div>
    </div>

    <main class="flex-1 max-w-7xl mx-auto px-6 py-12 w-full">
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-xl font-serif font-bold text-gray-900">My Bookings</h2>
        <a href="rooms.html" class="bg-gray-900 hover:bg-amber-600 text-white text-[11px] font-bold uppercase tracking-[0.2em] px-6 py-3 transition-all">
          + New Booking
        </a>
      </div>

      <div class="flex gap-3 mb-8 flex-wrap" id="filter-tabs">
        <button onclick="filterBookings(event, 'all')" class="tab-btn active-tab px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest border border-transparent">All</button>
        <button onclick="filterBookings(event, 'confirmed')" class="tab-btn px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest border border-gray-200 text-gray-600 hover:border-amber-500">Confirmed</button>
        <button onclick="filterBookings(event, 'upcoming')" class="tab-btn px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest border border-gray-200 text-gray-600 hover:border-amber-500">Upcoming</button>
        <button onclick="filterBookings(event, 'completed')" class="tab-btn px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest border border-gray-200 text-gray-600 hover:border-amber-500">Completed</button>
        <button onclick="filterBookings(event, 'cancelled')" class="tab-btn px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest border border-gray-200 text-gray-600 hover:border-amber-500">Cancelled</button>
      </div>

      <div id="bookings-container" class="space-y-4"></div>
      <div id="loading" class="space-y-4">
        <!-- Skeleton Loaders -->
        <div class="h-32 bg-white rounded border border-gray-100 animate-pulse"></div>
      </div>
      <div id="no-bookings" class="hidden text-center py-24">
        <p class="text-4xl mb-4">🛏</p>
        <p class="text-gray-400 text-sm">No reservations found.</p>
      </div>
      <div id="error-box" class="hidden text-center py-10 text-red-600 text-sm"></div>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>

    <script src="js/include.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
